[package]
name = "featherpad"
version = "0.1.0"
description = "FeatherPad offline desktop text editor"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "featherpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
