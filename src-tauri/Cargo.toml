[package]
name = "featherpad"
version = "0.1.0"
description = "FeatherPad offline desktop text editor"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "featherpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.29.0", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
globset = "=0.4.16"
ignore = "=0.4.23"
sha2 = "=0.10.9"
serde_json = "=1.0.154"
tauri-plugin-dialog = "=2.8.4"
regex = "=1.13.1"
base64 = "=0.23.1"
percent-encoding = "=2.3.2"
url = "=2.5.8"
imagesize = { version = "=0.15.0", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[dev-dependencies]

[patch.crates-io]
# Windows must honor main-frame-only initialization for untrusted previews.
wry = { path = "vendor/wry" }
